name: Publish HarborGate container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  MASTER_IMAGE_NAME: ${{ github.repository }}
  CHILD_IMAGE_NAME: ${{ github.repository }}-child

jobs:
  publish:
    name: Build and publish master and child images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate master image metadata
        id: master_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MASTER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Generate child image metadata
        id: child_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CHILD_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish HarborGate master
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.master_meta.outputs.tags }}
          labels: ${{ steps.master_meta.outputs.labels }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,mode=max,scope=master
          provenance: false

      - name: Build and publish HarborGate child
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.child
          platforms: linux/amd64
          push: true
          tags: ${{ steps.child_meta.outputs.tags }}
          labels: ${{ steps.child_meta.outputs.labels }}
          cache-from: type=gha,scope=child
          cache-to: type=gha,mode=max,scope=child
          provenance: false

      - name: Publish deployment summary
        run: |
          echo "## HarborGate images published" >> "$GITHUB_STEP_SUMMARY"
          echo "Master image:" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.REGISTRY }}/${{ env.MASTER_IMAGE_NAME }}:latest`' >> "$GITHUB_STEP_SUMMARY"
          echo "Child image for HARBORGATE_CHILD_IMAGE:" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.REGISTRY }}/${{ env.CHILD_IMAGE_NAME }}:latest`' >> "$GITHUB_STEP_SUMMARY"
